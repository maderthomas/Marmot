# This is a workflow to build the repo on ubuntu
name: build_ubuntu

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CC:   gcc-14
      CXX:  g++-14
    steps:
      - name: Install Python dependencies
        shell: bash -leo pipefail {0}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-dev python3-numpy

      - name: Install Eigen
        shell: bash -leo pipefail {0}
        run: |
          git clone --branch 3.4.0 https://gitlab.com/libeigen/eigen.git
          cd eigen
          mkdir build
          cd build
          cmake -DBUILD_TESTING=OFF  ..
          sudo make install
          cd ../..

      - name: Install Autodiff
        shell: bash -leo pipefail {0}
        run: |
          git clone --branch v1.1.0 https://github.com/autodiff/autodiff.git
          cd autodiff
          mkdir build
          cd build
          cmake -DAUTODIFF_BUILD_TESTS=OFF -DAUTODIFF_BUILD_PYTHON=OFF -DAUTODIFF_BUILD_EXAMPLES=OFF -DAUTODIFF_BUILD_DOCS=OFF ..
          sudo make install
          cd ../..

      - name: Install Fastor
        shell: bash -leo pipefail {0}
        run: |
          git clone --branch V0.6.4 https://github.com/romeric/Fastor.git
          cd Fastor
          mkdir build
          cd build
          cmake -DBUILD_TESTING=OFF  ..
          sudo make install
          cd ../..

      - name: Check out Marmot
        uses: actions/checkout@v4

      - name: Install Marmot
        shell: bash -leo pipefail {0}
        run: |
          mkdir build
          cd build
          cmake -DMARMOT_BUILD_PYTHON_BINDINGS=ON ..
          sudo make install
          # --no-tests=error: ctest exits 0 on an empty test set, which would
          # report success for a build that produced no tests at all.
          ctest --output-on-failure --no-tests=error

      - name: Debug TestDisplacementParticle
        if: failure()
        shell: bash -leo pipefail {0}
        run: |
          sudo apt-get install -y gdb > /dev/null
          cd build
          ls bin | head -3 || true
          echo "== without MALLOC_PERTURB_"; ./bin/TestDisplacementParticle > /dev/null 2>&1; echo "rc=$?"
          echo "== with MALLOC_PERTURB_=165 under gdb"
          MALLOC_PERTURB_=165 gdb -batch -ex run -ex bt -ex 'info frame' ./bin/TestDisplacementParticle 2>&1 | tail -80 || true
